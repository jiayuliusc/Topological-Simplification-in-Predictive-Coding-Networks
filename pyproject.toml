[project]
name = "topological-dl"
version = "0.1.0"
description = "Topological analysis utilities for predictive coding network experiments."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
analysis = [
  "dill",
  "matplotlib",
  "numpy",
  "pandas",
  "ripser",
  "scikit-learn",
  "scipy",
  "seaborn",
  "tqdm",
]
torch = [
  "matplotlib",
  "numpy",
  "scikit-learn",
  "scipy",
  "torch",
]
mnist = [
  "dill",
  "numpy",
  "pandas",
  "ripser",
  "scikit-learn",
  "scipy",
  "torch",
  "torchvision",
  "tqdm",
]
pcn = [
  "dill",
  "equinox",
  "jax",
  "jaxlib",
  "matplotlib",
  "numpy",
  "optax",
  "optuna",
  "optuna-dashboard",
  "pandas",
  "ripser",
  "scikit-learn",
  "scipy",
  "seaborn",
  "torch",
  "torchvision",
  "tqdm",
]
dev = [
  "pytest",
  "ruff",
  "dill",
  "matplotlib",
  "numpy",
  "pandas",
  "ripser",
  "scikit-learn",
  "scipy",
  "seaborn",
  "tqdm",
]

[project.urls]
Repository = "https://github.com/jiayuliusc/Topological-Simplification-in-Predictive-Coding-Networks"
Paper = "https://arxiv.org/abs/2608.02816"
DOI = "https://doi.org/10.48550/arXiv.2608.02816"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
